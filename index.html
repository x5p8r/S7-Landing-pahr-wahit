<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NULL Store</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #fff; color: #111; margin: 0; padding: 0; }
        header { padding: 20px 40px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.5rem; font-weight: bold; letter-spacing: 1px; }
        .cart { font-size: 1rem; color: #666; }
        main { padding: 50px 20px; max-width: 1200px; margin: auto; }
        h1 { text-align: center; margin-bottom: 40px; color: #ccc; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 30px; }
        .card { border: 1px solid #f5f5f5; padding: 20px; border-radius: 8px; text-align: center; transition: box-shadow 0.3s; }
        .card:hover { box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .img-placeholder { width: 100%; height: 200px; background: #fafafa; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; color: #bbb; border: 1px dashed #ddd; }
        
        button { background: #111; color: #fff; border: none; padding: 12px; cursor: pointer; border-radius: 6px; margin-top: 15px; width: 100%; transition: 0.2s; }
        button:hover { background: #333; }
        footer { text-align: center; padding: 30px; border-top: 1px solid #eee; color: #aaa; margin-top: 50px; }
    </style>
</head>
<body>

<header>
    <div class="logo">متجر NULL</div>
    <div class="cart">السلة ( NULL )</div>
</header>

<main>
    <h1>قسم الـ NULL</h1>
    <div class="grid" id="products-grid">
        </div>
</main>

<footer>
    &copy; NULL - جميع الحقوق محفوظة
</footer>

<script>
    // مصفوفة منتجات كلها NULL 
    const nullProducts = [
        { id: null, title: "NULL Product", price: null, image: "NULL" },
        { id: null, title: "NULL Product", price: null, image: "NULL" },
        { id: null, title: "NULL Product", price: null, image: "NULL" },
        { id: null, title: "NULL Product", price: null, image: "NULL" }
    ];

    const grid = document.getElementById('products-grid');

    // طباعة المنتجات الفاضية
    nullProducts.forEach(product => {
        grid.innerHTML += `
            <div class="card">
                <div class="img-placeholder">[ ${product.image} ]</div>
                <h3>${product.title}</h3>
                <p>السعر: ${product.price} $</p>
                <button onclick="alert('NULL')">أضف للـ NULL</button>
            </div>
        `;
    });
</script>

</body>
</html>
